name: Build Windows (Portable Zip)

on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_call:
    inputs:
      release_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-windows-portable-${{ github.ref }}
  cancel-in-progress: false

env:
  FB_SIGNALING_URL: ${{ vars.FB_SIGNALING_URL }}
  FB_FIREBASE_DATABASE_URL: ${{ vars.FB_FIREBASE_DATABASE_URL }}

jobs:
  build-windows-portable:
    name: Windows portable zip
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Enforce safe Rust policy
        shell: bash
        run: python3 policy/check_rust_policy.py
      - name: Build Rust client
        shell: bash
        run: cargo +1.98.0 build --release -p folderbuddies
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item target/release/folderbuddies.exe package/folderbuddies.exe
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package\* -DestinationPath folderbuddies-windows-dynamic.zip
      - uses: actions/upload-artifact@v4
        with:
          name: folderbuddies-windows-dynamic
          path: folderbuddies-windows-dynamic.zip
          if-no-files-found: error
