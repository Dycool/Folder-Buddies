name: Build Clients

on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_call:
    inputs:
      release_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  FB_SIGNALING_URL: ${{ vars.FB_SIGNALING_URL }}
  FB_FIREBASE_DATABASE_URL: ${{ vars.FB_FIREBASE_DATABASE_URL }}

jobs:
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install Linux packaging dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Enforce safe Rust policy
        shell: bash
        run: python3 policy/check_rust_policy.py
      - name: Build Rust client
        shell: bash
        run: cargo +1.98.0 build --release -p folderbuddies
      - name: Assemble AppDir
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          install -m755 target/release/folderbuddies AppDir/usr/bin/folderbuddies
          install -m644 client/src/folderbuddies.desktop AppDir/usr/share/applications/folderbuddies.desktop
          convert client/src/icons/icon.png -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/folderbuddies.png
      - name: Package AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          LDAI_OUTPUT: folderbuddies-linux.AppImage
          NO_STRIP: 1
        run: |
          set -euxo pipefail
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e AppDir/usr/bin/folderbuddies \
            -d AppDir/usr/share/applications/folderbuddies.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/folderbuddies.png \
            --output appimage
          test -s folderbuddies-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: folderbuddies-linux
          path: folderbuddies-linux.AppImage
          if-no-files-found: error

  build-macos:
    name: macOS .app
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install FUSE-T build dependency
        shell: bash
        run: |
          brew install --cask fuse-t
          brew install pkgconf
          mkdir -p "$RUNNER_TEMP/fuse-t-pkgconfig"
          cat > "$RUNNER_TEMP/fuse-t-pkgconfig/fuse.pc" <<'EOF'
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: fuse
          Description: FUSE-T libfuse compatibility
          Version: 2.9.9
          Libs: -L${libdir} -lfuse-t
          Cflags: -I${includedir}/fuse
          EOF
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/fuse-t-pkgconfig" >> "$GITHUB_ENV"
      - name: Enforce safe Rust policy
        shell: bash
        run: python3 policy/check_rust_policy.py
      - name: Build Rust client
        shell: bash
        run: cargo +1.98.0 build --release -p folderbuddies
      - name: Assemble app bundle
        shell: bash
        run: |
          set -euxo pipefail
          app='build/Folder Buddies.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m755 target/release/folderbuddies "$app/Contents/MacOS/folderbuddies"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Folder Buddies</string>
            <key>CFBundleDisplayName</key><string>Folder Buddies</string>
            <key>CFBundleIdentifier</key><string>com.folderbuddies.app</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleExecutable</key><string>folderbuddies</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != ''
        shell: bash
        env:
          RUNNER_TEMP_KEYCHAIN_PASSWORD: folderbuddies-ci-keychain
        run: |
          security create-keychain -p "$RUNNER_TEMP_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP_KEYCHAIN_PASSWORD" build.keychain
      - name: Codesign
        shell: bash
        run: |
          app='build/Folder Buddies.app'
          if [ -n "$MACOS_CODESIGN_IDENTITY" ]; then
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_CODESIGN_IDENTITY" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Notarize and staple
        if: env.MACOS_CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: |
          ditto -c -k --keepParent 'build/Folder Buddies.app' folderbuddies-macos-notary.zip
          xcrun notarytool submit folderbuddies-macos-notary.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple 'build/Folder Buddies.app'
      - name: Package .app
        shell: bash
        run: ditto -c -k --keepParent 'build/Folder Buddies.app' folderbuddies-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: folderbuddies-macos
          path: folderbuddies-macos.zip
          if-no-files-found: error

  build-windows:
    name: Windows .exe
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Enforce safe Rust policy
        shell: bash
        run: python3 policy/check_rust_policy.py
      - name: Build Rust client
        shell: bash
        run: cargo +1.98.0 build --release -p folderbuddies
      - name: Stage executable
        shell: pwsh
        run: Copy-Item target/release/folderbuddies.exe folderbuddies-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: folderbuddies-windows
          path: folderbuddies-windows.exe
          if-no-files-found: error
