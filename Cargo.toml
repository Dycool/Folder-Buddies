[workspace]
resolver = "3"
members = [
    "crates/folderbuddies-core",
    "crates/folderbuddies-app",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"

[workspace.dependencies]
argon2 = "=0.6.0"
base64 = "=0.22.1"
chacha20poly1305 = "=0.11.0"
crossbeam-channel = "=0.5.15"
ctrlc = "=3.5.0"
eframe = "=0.36.1"
fsk = "=0.0.9"
getrandom = "=0.4.3"
hmac = "=0.13.0"
igd-next = "=0.17.1"
percent-encoding = "=2.3.2"
quinn = "=0.11.11"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
socket2 = "=0.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
transmute_ptr_to_ptr = "forbid"
undocumented_unsafe_blocks = "forbid"
allow_attributes = "deny"
