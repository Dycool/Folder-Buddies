[workspace]
resolver = "3"
members = [
    "crates/folderbuddies-core",
    "crates/folderbuddies-app",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"

[workspace.dependencies]
argon2 = "=0.6.0"
base64 = "=0.22.1"
bytes = "=1.12.1"
chacha20poly1305 = "=0.11.0"
crossbeam-channel = "=0.5.15"
ctrlc = "=3.5.0"
eframe = "=0.36.1"
fs2 = "=0.4.3"
fsk = "=0.0.9"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hmac = "=0.13.0"
igd-next = "=0.17.1"
percent-encoding = "=2.3.2"
quinn = "=0.11.11"
rcgen = "=0.14.10"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
socket2 = "=0.6.5"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
webrtc = "=0.17.2"
webrtc-ice = "=0.17.2"
webrtc-util = "=0.17.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
transmute_ptr_to_ptr = "forbid"
undocumented_unsafe_blocks = "forbid"
allow_attributes = "deny"
